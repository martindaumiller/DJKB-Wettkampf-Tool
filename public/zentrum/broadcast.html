<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDM · Kameraausgabe für YouTube / OBS</title><style>html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden}video{width:100%;height:100%;object-fit:contain}button{position:fixed;top:12px;right:12px;padding:12px;background:#fff;border:0;border-radius:6px;font:16px sans-serif}body:fullscreen button{display:none}p{position:fixed;bottom:15%;width:100%;text-align:center;color:#fff;font:20px sans-serif}p[hidden]{display:none}</style></head><body><video autoplay muted playsinline aria-label="Webcam mit eingeblendeten Startern und Ergebnissen"></video><p id="waiting">Webcam am Tisch einschalten und „Kameraausgabe öffnen“ wählen.</p><button id="full">Vollbild</button><script type="module">if(new URLSearchParams(location.search).get('clean')==='1'){document.title='SDM · Archiv ohne Einblendungen';document.querySelector('video').setAttribute('aria-label','Kamerabild ohne Einblendungen');}document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen();document.querySelector('video').onplaying=()=>document.querySelector('#waiting').hidden=true;document.querySelector('video').onended=()=>{document.querySelector('#waiting').hidden=false;document.querySelector('#waiting').textContent='Webcam beendet. Kameraausgabe am Tisch erneut öffnen.';};</script></body></html>
