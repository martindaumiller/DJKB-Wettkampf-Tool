<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDM26 · Stream-Probe</title><link rel="stylesheet" href="./style.css?v=64"><link rel="stylesheet" href="./presentation50.css?v=50"></head><body><main class="stream-rehearsal"><header><h1>Livestream-Probe</h1><span class="test-feed-label">TESTBILD · FIKTIVE NAMEN</span></header><p><a class="btn quiet" href="./stream-five.html">Fünf Streams gleichzeitig testen</a></p><div class="actions"><button id="auto">Automatischer Durchlauf</button><button data-scene="camera">Begegnung</button><button data-scene="kata">Kata-Noten</button><button data-scene="bracket">Wettkampfbaum</button><button data-scene="medical">Arztunterbrechung</button><button data-scene="ceremony">Siegerehrung</button><button id="record">30 Sekunden aufnehmen</button><button id="output">Nur Bild · OBS / Vollbild</button></div><canvas id="stream-output" class="stream-test-output" width="1280" height="720" aria-label="Komponiertes Stream-Testbild"></canvas><p id="test-status" role="status">Probe wird vorbereitet …</p><div class="stream-checklist"><label><input type="checkbox"> Namen, Seiten, Uhr und Noten in der Ausgabe prüfen</label><label><input type="checkbox"> Arztunterbrechung: vollständig schwarzer Hintergrund, kein Kamerabild</label><label><input type="checkbox"> OBS: dieses Fenster als Fensteraufnahme oder Browserquelle auswählen</label><label><input type="checkbox"> YouTube Studio: nur Vorschau prüfen, Termin nicht gelistet lassen</label></div><p>Die Probe sendet selbst kein Video an YouTube. Eine Aufnahme lässt sich in OBS als Medienquelle abspielen. Am Sendegerät anschließend Bild, Ton und YouTube-Vorschau gemeinsam prüfen.</p></main><script type="module" src="./stream-rehearsal.js?v=64"></script></body></html>
